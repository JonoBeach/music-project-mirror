<main>
  <h1>{{ title }}</h1>
  <form method="POST">
    {{ form.csrf_token }}
    <p>username: </p>{{ form.username }}
    <p>password: </p>{{ form.password }}

    {% if form.confirm != None %} <!-- if coming from register url -->
      <p>confirm password: </p>{{ form.confirm }}
    {% endif %}

    <br><br>
    {{ form.submit }}
  </form>
</main>
