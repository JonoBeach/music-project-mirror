<div class="track_list_item">
    <h3>
        <a class="brown_link" href="{{ url_for('tracks_bp.track_detail', track_id=track.track_id) }}">
            {{ track.title }}
        </a>
    </h3>
    <p>Duration: {{track.track_duration // 60 }}:{{ "%02d" | format(track.track_duration % 60 ) }}</p>
    <p>Artist: {{ track.artist.full_name}}</p>
    <p>Album: {{ track.album.title }}</p>
    {% if track.track_id in favourite_tracks %}
      <form method="POST">
          <!-- hidden input to tell service what track_id is -->
          <input type="hidden" name="track_id" value="{{ track.track_id }}">
          <input class="button" type="submit" name="action" value="Remove from favourites">
      </form>
    {% else %}
      <form method="POST">
          <!-- hidden input to tell service what track_id is -->
          <input type="hidden" name="track_id" value="{{ track.track_id }}">
          <input class="button" type="submit" name="action" value="Add to favourites">
      </form>
    {% endif %}
</div>
